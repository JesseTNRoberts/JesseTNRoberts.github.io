# Research areas, funding and fellowships. One source for the Research page (/research/), the
# homepage summary, and the CV's Grants section.
#
# Papers are attached to an area automatically: a Scholar paper whose title contains any of the
# area's `keywords` (case-insensitive) counts toward it. The Research page showcases the area's
# `selected` papers (title fragments), or its most-cited ones if none are listed. To fix one
# paper's areas, set `areas:` for it in _data/publication_overrides.yml.

group:
  name: Language and Artificial Intelligence Research (LAIR) group
  short: LAIR
  institution: Tennessee Tech University

# One line that frames all of the work (shown on the homepage and the Research page).
tagline: >-
  I study how neural networks, and language models in particular, learn and reason. I also put
  that understanding to work on real problems, from helping keep endangered languages alive to
  detecting tornadoes.

areas:
  - id: fundamentals
    title: Deep learning fundamentals
    icon: fas fa-project-diagram
    summary: >-
      What can neural networks compute, why do they train, and how can we tell what they've
      actually learned? This work ranges from proofs about the computational power of decoder-only
      transformers to tools like Torch Canvas that make architectures, initialization and signal
      propagation visible.
    keywords: [decoder-only transformer, turing complete, universal function approximator, "rl+ transformer"]
    selected: ["How Powerful are Decoder-Only", "RL+ Transformer"]
    links:
      - { title: Torch Canvas, url: /tools/torch-canvas/ }
      - { title: Interactive demos, url: /learn/ }
      - { title: "Deep Learning course (AI 4200/5200)", url: /teaching/F2026-AI4200 }

  - id: llms
    title: Large language models
    icon: fas fa-comments
    summary: >-
      How large language models represent uncertainty, reason, and learn, and how their behavior
      compares with human cognition. Topics include calibration and human-aligned uncertainty,
      memory effects, test-taking strategies, and alignment from feedback.
    keywords: [language model, llm, llms, chain of thought, artificial populations, base-rate effect, reward model, bart, uncertainty]
    # Papers to showcase (title fragments, in order). Leave empty to show the most cited.
    selected:
      - "base-rate effect on llm benchmark"
      - "artificial populations to study psychological"
      - "recall uncertainty is modulated by the fan effect"
      - "Chain of thought still thinks fast"
      - "Investigating Human-Aligned Large Language Model Uncertainty"
    links:
      - { title: "CSC 7970 seminar on LLMs", url: /teaching/S2026-CSC7970 }
      - { title: LLM foundations reading list, url: "https://www.zotero.org/groups/5650079/llm_foundations_reading/items/PA9EGZCE" }

  - id: cherokee
    title: Cherokee language NLP
    icon: fas fa-language
    summary: >-
      Language technology in support of Cherokee (Tsalagi) revitalization, built with and for the
      community. Drawing on what worked for Irish (Gaeilge), the goal is a living resource that
      supports future generations of Cherokee speakers, along with the methods low-resource,
      polysynthetic languages need, such as better tokenization.
    highlight: fellowship-core          # id from `honors` below, shown as a callout
    keywords: [cherokee, tsalagi, polysynthetic, indigenous, endangered language]
    selected:
      - "Tokenization Properties in Low-Resource Polysynthetic"
    press:
      - { title: "Tennessee Tech professor uses AI to help preserve Cherokee language", outlet: Tennessee Tech News, url: "https://www.tntech.edu/news/releases/24-25/tech-professor-uses-ai-to-help-preserve-cherokee-language.php" }
      - { title: "This Tennessee Tech professor is working to help preserve the Cherokee language using AI", outlet: NewsChannel 5 Nashville, url: "https://www.newschannel5.com/news/this-tennessee-tech-professor-is-working-to-help-preserve-the-cherokee-language-using-ai" }
      - { title: "Tennessee Tech uses AI to help preserve the Cherokee language", outlet: WBIR 10 Knoxville, url: "https://www.wbir.com/article/news/education/tennessee-tech-cookeville-ai-cherokee/51-ceb2f79f-1f99-4076-8f9a-cb1d1b2f827d" }
      - { title: "Linguistic preservation", outlet: Herald-Citizen, url: "https://www.herald-citizen.com/news/education/linguistic-preservation/article_992ad803-2471-5401-b31e-3cf02fd2ccc1.html" }
      - { title: "Cherokee preservation with AI", outlet: The Ledger (Knoxville), url: "https://www.tnledger.com/Knoxville/editorial/Article.aspx?id=195168" }

  - id: snn
    title: Spiking neural networks
    icon: fas fa-bolt
    emerging: true
    summary: >-
      We are studying the fundamentals of spiking neural networks and their use in real-time
      environments. We are developing capability in this space now and have multiple papers in
      the works.
    keywords: [spiking, spike, neuromorphic, gen 2 ann]

  - id: tornado
    title: Tornado detection
    icon: fas fa-wind
    emerging: true
    summary: >-
      We are working on tornado detection in areas where radar sweeps pass well above the ideal
      range for detecting couplet rotation, as they do across a large portion of Tennessee.
    keywords: [tornado, severe weather, radar]

