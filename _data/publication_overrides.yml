# Per-paper adjustments to the list mirrored from Google Scholar (applied at build time).
# `title` matches case-insensitively as a substring of the Scholar title.
#
#   tier   override the venue tier from _data/venues.yml (1 = A*, 2 = journal, ... 7 = preprint)
#   label  override the venue badge
#   note   short note shown with the paper (e.g. an award)
#   hide   true to leave the paper off the Publications page and CV
#   areas  research area ids from _data/research.yml (replaces keyword matching for this paper)
#
# Fix titles, authors, years and venues on your Scholar profile itself; they flow through
# the next morning.

- title: "Finding an Equilibrium in the Traveler's Dilemma"
  note: "Nominated for best paper"
  areas: [games]      # moved out of the outliers at Jesse's request, 2026-11-08

- title: "Introduction to PLC Automation"
  hide: true          # listed separately as the textbook at the top of the Publications page

- title: "A Theoretical & Empirical Analysis of Transformer Language Model Behavior"
  label: "Ph.D. Dissertation"
  areas: [llms, fundamentals]

# Research areas set by Jesse on 2026-10-31. Papers in more than one area show in each.
- title: "How Powerful are Decoder-Only Transformer"
  areas: [fundamentals, llms]

- title: "Exploitation Is All You Need"
  areas: [fundamentals, games]   # games added 2026-11-08 (RL exploration is sequential decision making)

- title: "RL+ Transformer"
  areas: [fundamentals, games]

- title: "pReview: The artificially intelligent conference reviewer"
  areas: [llms]

- title: "Do Large Language Models Learn Human-Like Strategic Preferences"
  areas: [llms, games]

- title: "LLMs as Agentic Cooperative Players in Multiplayer UNO"
  areas: [llms, games]

- title: "Action Plan for Artificial Intelligence Education"
  areas: [games]

# Added in the full review on 2026-11-08.
- title: "Decision-Criteria-Informed Learning for Threshold-Based Decisions"
  areas: [games, fundamentals]

- title: "Biologically Extending the Gen 2 ANN Model"
  areas: [snn, fundamentals]

