# Per-paper adjustments to the list mirrored from Google Scholar (applied at build time).
# `title` matches case-insensitively as a substring of the Scholar title.
#
#   tier   override the venue tier from _data/venues.yml (1 = A*, 2 = journal, ... 7 = preprint)
#   label  override the venue badge
#   note   short note shown with the paper (e.g. an award)
#   hide   true to leave the paper off the Publications page and CV
#   areas  research area ids from _data/research.yml (replaces keyword matching for this paper)
#
# Fix titles, authors, years and venues on your Scholar profile itself; they flow through
# the next morning.

- title: "Finding an Equilibrium in the Traveler's Dilemma"
  note: "Nominated for best paper"

- title: "Introduction to PLC Automation"
  hide: true          # listed separately as the textbook at the top of the Publications page

- title: "A Theoretical & Empirical Analysis of Transformer Language Model Behavior"
  label: "Ph.D. Dissertation"
