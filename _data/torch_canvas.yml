# Torch Canvas: the tool (separate repo, served at /torch-canvas/) and how the site features it.
#
# The list of example models and blocks is NOT kept here: it's synced daily from the official repo
# into _data/torch_canvas_library.json (with thumbnails and parameter counts) by
# scripts/sync_torch_canvas.js. Add a model by adding it to the torch-canvas repo's examples/.
#
# Link to any example with /torch-canvas/?open=<id>, or on a page:
#   {% include torch-canvas-link.html model="<id>" %}

tool:
  title: Torch Canvas
  url: /torch-canvas/              # the app itself (do not create this path in this repo)
  page: /tools/torch-canvas/       # the site's page about it (_pages/torch-canvas.html)
  repo: https://github.com/JesseTNRoberts/torch-canvas
  tagline: "See, build and understand neural networks"
  description: >-
    Torch Canvas turns neural networks into diagrams you can read, edit and run. Draw a model and
    the PyTorch code writes itself, or paste PyTorch and watch it become a diagram. Use it to teach,
    to make figures for papers, and to understand what every component does. It runs in the browser
    with nothing to install.

# What it's for, shown near the top of the Torch Canvas page.
uses:
  - icon: fas fa-chalkboard-teacher
    title: Teach architectures
    text: >-
      Show how a network is put together, from a 10-layer MLP to Llama 2, with tensor shapes on
      every connection. Each example has its own link, so a slide can open the exact model.
  - icon: fas fa-file-image
    title: Make figures for papers
    text: >-
      Export any diagram as a clean SVG for papers and slides, drawn the way it looks on screen,
      with size labels placed where they read best.
  - icon: fas fa-pencil-ruler
    title: Code visually
    text: >-
      Build a model by drawing it. Every edit updates clean, runnable PyTorch, and pasting a module
      turns it back into a diagram you can keep editing.
  - icon: fas fa-microscope
    title: Understand the components
    text: >-
      Select any piece to see what it computes, how it changes the shape and what it adds in
      parameters. A variance plot shows how the signal grows or shrinks through the network before
      training.

# Shown first on the Torch Canvas page and on /learn/ (ids from the library).
featured: [gpt2, llama2_7b, bert_base, qwen2_5_vl_3b]

# Which courses use which examples (shown on those course pages).
courses:
  llama2_7b: [AI4200]

# What the tool does (from the repo's README). Shown on the Torch Canvas page.
features:
  - icon: fas fa-code
    title: Diagram ⇄ code, both ways
    text: >-
      Draw a network and the PyTorch code updates as you go. Paste an nn.Module (or a torch.fx export)
      and it becomes a diagram. Every example round-trips from diagram to code and back to the same diagram.
  - icon: fas fa-ruler-combined
    title: Shapes and parameters, live
    text: >-
      Tensor sizes are worked out symbolically and shown on every connection, with a running
      parameter count. A size that doesn't fit, like a head count that doesn't divide d, turns red.
  - icon: fas fa-chart-line
    title: See variance before you train
    text: >-
      Plot how activation and gradient variance change through the network right after
      initialization, worked out analytically. Change an init and replot to compare.
  - icon: fas fa-cubes
    title: Reusable blocks
    text: >-
      Define a block once (a transformer layer, a SwiGLU MLP) and repeat it. Edit it anywhere and
      every network that uses it updates.
  - icon: fas fa-dumbbell
    title: Ready-to-run training scripts
    text: >-
      Add a loss (cross-entropy with next-token or masked targets, BCE, MSE, L1, Huber), then export
      model.py and a complete train.py with your optimizer, schedule, precision, and checkpointing.
  - icon: fas fa-check-double
    title: Real architectures, checked
    text: >-
      GPT-2, BERT, Llama 2 and Qwen2.5-VL match their reference implementations, with the same parameter
      counts at full size, and the same outputs with the weights copied across (GPT-2 against nanoGPT,
      the others against Hugging Face transformers).

# Categories for the example list on the Torch Canvas page, in display order. Each example (network
# or block) goes in the first category whose `match` words appear in its id; list an id under `ids`
# to place it by hand. Examples that match nothing appear under "More examples", so a new example
# in the torch-canvas repo always shows up. Assigned at build time by _plugins/torch_canvas.rb.
categories:
  - id: mlps
    title: MLPs and residual basics
    icon: fas fa-layer-group
    blurb: Small fully connected networks for seeing how depth, activations, normalization and residuals behave.
    match: [mlp, linear_relu, gated, swiglu]
  - id: cnns
    title: Convolutional networks
    icon: fas fa-th
    blurb: Image classification, detection and segmentation built from convolutions.
    match: [cnn, resnet, yolo, darknet, unet]
  - id: sequence
    title: Recurrent and state-space models
    icon: fas fa-redo
    blurb: Networks that carry a state through a sequence, from the Elman RNN to Mamba.
    match: [rnn, lstm, gru, mamba]
  - id: transformers
    title: Transformers and language models
    icon: fas fa-align-left
    blurb: The original encoder-decoder Transformer and the language models built on it.
    match: [transformer, gpt, bert, llama]
  - id: vision
    title: Vision transformers and multimodal
    icon: fas fa-eye
    blurb: Transformers that read images, alone or together with text.
    match: [vit, qwen]
  - id: generative
    title: Generative and self-supervised
    icon: fas fa-magic
    blurb: Models that learn without labels, by reconstructing their input or predicting hidden parts of it.
    match: [vae, jepa]
